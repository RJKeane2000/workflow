name: Project Status Change

on:
  project_card:

jobs:
  say-hello:
    runs-on: ubuntu-latest

    steps:
      - name: Show event context and payload (debug)
        run: |
          echo "GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"
          echo "github.event.action=${{ github.event.action }}"
          echo "github.event.project_card.action=${{ github.event.project_card.action }}"
          echo "GITHUB_EVENT_PATH=$GITHUB_EVENT_PATH"
          echo "Event payload:"
          cat "$GITHUB_EVENT_PATH"

      - name: Detect project_card details
        if: github.event_name == 'project_card'
        id: detect
        run: |
          echo "project_card id: ${{ github.event.project_card.id }}"
          echo "project_card column_id: ${{ github.event.project_card.column_id }}"
          echo "project_card project_id: ${{ github.event.project_card.project_id }}"
          echo "project_card content_url: ${{ github.event.project_card.content_url }}"

      - name: Say hello
        run: echo "hello"
