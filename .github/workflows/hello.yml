name: Project Status Change

on:
  project_card:
  projects_v2_item:

jobs:
  say-hello:
    runs-on: ubuntu-latest

    steps:
      - name: Show event context and payload (debug)
        run: |
          echo "GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"
          echo "github.event.action=${{ github.event.action }}"
          echo "github.event.projects_v2_item.action=${{ github.event.projects_v2_item.action }}"
          echo "GITHUB_EVENT_PATH=$GITHUB_EVENT_PATH"
          echo "Event payload:"
          cat "$GITHUB_EVENT_PATH"

      - name: Detect status change
        if: github.event_name == 'projects_v2_item'
        id: detect
        run: |
          BEFORE="${{ github.event.changes.status_field_value.from }}"
          AFTER="${{ github.event.projects_v2_item.status }}"

          echo "Previous status: $BEFORE"
          echo "New status: $AFTER"

          if [ "$BEFORE" != "$AFTER" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Say hello
        if: steps.detect.outputs.changed == 'true'
        run: echo "hello"
