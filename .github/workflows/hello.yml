name: On Project Item Status Change

on:
  projects_v2_item:
    types: [edited]

jobs:
  on-status-change:
    runs-on: ubuntu-latest
    steps:
      - name: Dump webhook payload for debugging
        run: echo "${{ toJson(github.event) }}"
      
      # Example: Check if the status custom field changed
      - name: Check status change
        id: filter
        run: |
          # Parse JSON to examine changes
          STATUS_PREV=$(echo '${{ toJson(github.event.changes) }}' | jq -r '.field_value.value.from')
          STATUS_NEW=$(echo '${{ toJson(github.event.projects_v2_item.field_value.value) }}')

          echo "Previous status: $STATUS_PREV"
          echo "Current status: $STATUS_NEW"

          # Set output for conditional jobs
          echo "changed=$( [ "$STATUS_PREV" != "$STATUS_NEW" ] && echo 'true' || echo 'false' )" >> $GITHUB_OUTPUT

      - name: Continue if status changed
        if: steps.filter.outputs.changed == 'true'
        run: |
          echo "Status changed! Continue with further steps..."
          # Add your custom logic here